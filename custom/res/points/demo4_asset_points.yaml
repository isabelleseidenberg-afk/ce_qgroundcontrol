# Demo #4 (Points Round) — asset point values.
#
# Flat YAML mapping of "<Color> <Shape>: <points>" (colorless special
# shapes use just "<Shape>"). Edit the numbers to match the customer's
# scoring; the operator loads this file in QGC (or points to their own copy).
# The Points Round is about the CV finding the highest-value assets and
# planning a route to collect the most points, so every possible asset is
# listed here with its value (default 1).

